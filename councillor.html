        // liverpool city council councillors by ward, from

        // keyed by the ward's ONS code, which is what postcodes.io gives back for a postcode
        // ward code: [ward, [[councillor, email], ...]]
        const LIVERPOOL = "E08000012";
        const COUNCIL_PAGE = "https://councillors.liverpool.gov.uk/mgMemberIndex.aspx?bcr=1";

        // the email that opens when you click an address. {name} and {ward} get filled in
        const SUBJECT = "Breck Road Library";
        const MESSAGE = `Dear {name},

i am a resident of {ward} & am appalled at the lack of a library in my area. Breck Road Library was my local, & a place many of my peers & myself have fond important memories of. Its seemingly permanent shuttering is a disgrace as it stands a derelict reminder of your incapability to create a communal hub for this already struggling area. There is no place for us people to communicate & learn because you are content to let it rot. Please consider putting your efforts to rectify this, i hear there is hope- please do not ignore it`;

            "E05015291": ["Clubmoor West", [["Si Jones", "si.jones@liverpool.gov.uk"]]],
            "E05015292": ["County", [["John Jennings", "John.Jennings@liverpool.gov.uk"], ["Bernard Packenham", "Bernard.Packenham@liverpool.gov.uk"]]],
            "E05015293": ["Croxteth", [["Anthony Lavelle", "anthony.lavelle@liverpool.gov.uk"]]],

            "E05015295": ["Dingle", [["Sarah Doyle", "sarah.doyle@liverpool.gov.uk"], ["Steve Munby", "stephen.munby@liverpool.gov.uk"]]],

            "E05015327": ["Toxteth", [["Rahima Farah", "Rahima.Farah@liverpool.gov.uk"]]],
            "E05015328": ["Tuebrook Breckside Park", [["Joe Dunne", "joe.dunne@liverpool.gov.uk"]]],
            "E05015329": ["Tuebrook Larkhill", [["Billy Lake", "billy.lake@liverpool.gov.uk"]]],
            "E05015330": ["Vauxhall", [["Assen Christov", "assen.christov@liverpool.gov.uk"], ["Lisa Gaughan", "lisa.gaughan@liverpool.gov.uk"]]],
            "E05015331": ["Walton", [["Sam East", "sam.east@liverpool.gov.uk"], ["Beverley Kenyon", "Beverley.Kenyon@liverpool.gov.uk"]]],
            "E05015332": ["Waterfront North", [["Dave Hanratty", "dave.hanratty2@liverpool.gov.uk"]]],
            "E05015333": ["Waterfront South", [["Rebecca Turner", "Rebecca.Turner@liverpool.gov.uk"]]],
            "E05015334": ["Wavertree Garden Suburb", [["Julie Fadden", "julie.fadden@liverpool.gov.uk"]]],
            "E05015335": ["Wavertree Village", [["Laurence Sidorczuk", "laurence.sidorczuk2@liverpool.gov.uk"]]],
            "E05015336": ["West Derby Deysbrook", [["John Prince", "john.prince@liverpool.gov.uk"]]],
            "E05015337": ["West Derby Leyfield", [["Finley Nolan", "Finley.Nolan@liverpool.gov.uk"]]],
            "E05015338": ["West Derby Muirhead", [["Colette Goulding", "colette.goulding2@liverpool.gov.uk"]]],
            "E05015339": ["Woolton Village", [["Malcolm Kelly", "Malcolm.kelly@liverpool.gov.uk"]]],
            "E05015340": ["Yew Tree", [["Daniel Barrington", "daniel.barrington@liverpool.gov.uk"], ["Barbara Murray", "barbara.murray@liverpool.gov.uk"]]]
        };

        const form = document.getElementById("councillor-form");
        const input = document.getElementById("postcode");
        const result = document.getElementById("councillor-result");
        let lookup = 0;

        // fallback in case a ward code ever changes but the name doesn't
        const simplify = (name) => String(name).toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
        const WARDS_BY_NAME = {};
        for (const code in WARDS) {
            WARDS_BY_NAME[simplify(WARDS[code][0])] = WARDS[code];
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const id = ++lookup;
            const postcode = input.value.toUpperCase().replace(/\s+/g, "");

            if (!/^[A-Z]{1,2}[0-9][A-Z0-9]?[0-9][A-Z]{2}$/.test(postcode)) {
                Show(Say("that's not a full postcode"));
                return;
            }

            Show(Say("looking..."));

            let response, data;
            try {
                response = await fetch("https://api.postcodes.io/postcodes/" + postcode);
                data = await response.json();
            } catch (error) {
                if (id === lookup) {
                    Show(Say("couldn't look that up, try again in a bit"));
                }
                return;
            }

            if (id !== lookup) {
                return; // a newer search has started
            }

            if (response.status === 404) {
                Show(Say(data && data.terminated ? "that postcode isn't used anymore" : "can't find that postcode"));
                return;
            }

            const place = data && data.result;
            if (!response.ok || !place) {
                Show(Say("couldn't look that up, try again in a bit"));
                return;
            }

            if (place.codes?.admin_district !== LIVERPOOL) {
                Show(
                    Say(place.postcode + " is in " + (place.admin_district || "a different council") + ", only liverpool for now"),
                    Line(Link("find yours on gov.uk", "https://www.gov.uk/find-your-local-councillors"))
                );
                return;
            }

            const ward = WARDS[place.codes.admin_ward] || WARDS_BY_NAME[simplify(place.admin_ward)];
            if (!ward) {
                Show(
                    Say("couldn't match " + place.postcode + " to a ward"),
                    Line(Link("try the council's list", COUNCIL_PAGE))
                );
                return;
            }

            const [wardname, councillors] = ward;
            const nodes = [Say(place.postcode + " is in " + wardname + " ward")];

            for (const [name, email] of councillors) {
                const cllr = Line(Link(email, MailTo([email], "Councillor " + Surname(name), wardname)));
                cllr.className = "cllr";
                const bold = document.createElement("b");
                bold.textContent = name;
                cllr.prepend(bold);
                nodes.push(cllr);
            }

            if (councillors.length > 1) {
                const surnames = councillors.map(c => Surname(c[0]));
                const everyone = "Councillors " + surnames.slice(0, -1).join(", ") + " & " + surnames[surnames.length - 1];
                const all = Line(Link("email them all", MailTo(councillors.map(c => c[1]), everyone, wardname)));
                all.className = "cllr";
                nodes.push(all);
            }

            Show(...nodes);
        });

        // "Richard Kemp, CBE" -> "Kemp", "Lord Mike Storey" -> "Storey"
        function Surname(name) {
            return name.replace(/,.*$/, "").trim().split(" ").pop();
        }

        function MailTo(emails, name, ward) {
            const body = MESSAGE.split("{name}").join(name).split("{ward}").join(ward).replace(/\r?\n/g, "\r\n");
            return "mailto:" + emails.join(",") + "?subject=" + encodeURIComponent(SUBJECT) + "&body=" + encodeURIComponent(body);
        }

        function Show(...nodes) {
            result.replaceChildren(...nodes);
        }

        function Say(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div;
        }

        function Line(...nodes) {
            const div = document.createElement("div");
            div.append(...nodes);
            return div;
        }

        function Link(text, href) {
            const a = document.createElement("a");
            a.textContent = text;
            a.href = href;
            return a;
        }
    </script>
