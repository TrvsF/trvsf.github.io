        // ward code: [ward, [[councillor, email], ...]]
        const LIVERPOOL = "E08000012";

        // the email that opens when you click an address

        const SUBJECT = "Breck Road Library";
        const MESSAGE = `Dear {councillor}

My full name is {name} and I live in {postcode}

I am writing to formally register my disappointment at the continued closure of Breck Road Library. The library meant so much to so many in this community. It was a place where people could freely access books, computers, support services and community activities.

As you will know, every council in England is required to provide a ‘comprehensive and efficient’ library service under the Public Libraries and Museums Act 1964. It must do so in a way which meets the needs of people living, studying or working in the area, taking into account the resources available.

The contextual factors affecting your constituency include:

* 36.1% of Everton North households experience at least two overlapping dimensions of deprivation
* 34% of Everton North residents aged 16 and over have no formal qualifications
* 5.8% - 6.2% residents claiming Jobseeker's Allowance or Universal Credit while required to seek work within the Liverpool Riverside parliamentary constituency


These are just to highlight a few of the significant barriers faced by people in your constituency.

When the library closed Liverpool City Council assured our community that they would work to create alternative and accessible provision. While I appreciate the council has made efforts to provide residents with books through the Home library service this fails to acknowledge the digital and language barriers people may face to access this provision. It also fails to recognise that the many benefits for residents that attending a local library can have both physically and mentally.

Liverpool City Council have also pledged to use Pride in Place funding to build a community hub. This would make a positive addition to our local community but is a suggestion that has been made without thorough community consultation and should be a decision taken by the neighbourhood Pride in Place board who will manage the funding. Other communities do not have to face choices between a community hub and a library, Both are spaces that could enrich and support our community as distinct entities.

As my local representative I would like to know:

1. What are you doing to ensure that Liverpool City Council carries out its statutory duty to provide our community with a well resourced and accessible local library with funding accounted for within their annual budget?
2. What analysis and data do you have to justify that the council's current provision is meeting the needs of local residents within your constituency?
3. Will you commit to lobbying the rest of the council on behalf of your constituents to ensure that a library is re-opened in the community as a matter of urgency?


I look forward to hearing from you, sincerely
{name}`;

            "E05015331": ["Walton", [["Sam East", "sam.east@liverpool.gov.uk"], ["Beverley Kenyon", "Beverley.Kenyon@liverpool.gov.uk"]]],

            "E05015334": ["Wavertree Garden Suburb", [["Julie Fadden", "julie.fadden@liverpool.gov.uk"]]],
            "E05015335": ["Wavertree Village", [["Laurence Sidorczuk", "laurence.sidorczuk2@liverpool.gov.uk"]]],
            "E05015336": ["West Derby Deysbrook", [["John Prince", "john.prince@liverpool.gov.uk"]]],
            "E05015337": ["West Derby Leyfield", [["Finley Nolan", "Finley.Nolan@liverpool.gov.uk"]]],
            "E05015338": ["West Derby Muirhead", [["Colette Goulding", "colette.goulding2@liverpool.gov.uk"]]],
            "E05015339": ["Woolton Village", [["Malcolm Kelly", "Malcolm.kelly@liverpool.gov.uk"]]],

        const form = document.getElementById("councillor-form");
        const nameInput = document.getElementById("yourname");
        const input = document.getElementById("postcode");
        const result = document.getElementById("councillor-result");
        let lookup = 0;

        // typing a name after searching still updates the emails
        nameInput.addEventListener("input", RefreshEmails);

        // fallback in case a ward code ever changes but the name doesn't
        const simplify = (name) => String(name).toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
        const WARDS_BY_NAME = {};
        for (const code in WARDS) {
            WARDS_BY_NAME[simplify(WARDS[code][0])] = WARDS[code];
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const id = ++lookup;
            const postcode = input.value.toUpperCase().replace(/\s+/g, "");

            if (!/^[A-Z]{1,2}[0-9][A-Z0-9]?[0-9][A-Z]{2}$/.test(postcode)) {
                Show(Say("that's not a full postcode"));
                return;
            }

            Show(Say("looking..."));

            let response, data;
            try {
                response = await fetch("https://api.postcodes.io/postcodes/" + postcode);
                data = await response.json();
            } catch (error) {
                if (id === lookup) {
                    Show(Say("couldn't look that up, try again in a bit"));
                }
                return;
            }

            if (id !== lookup) {
                return; // a newer search has started
            }

            if (response.status === 404) {
                Show(Say(data && data.terminated ? "that postcode isn't used anymore" : "can't find that postcode"));
                return;
            }

            const place = data && data.result;
            if (!response.ok || !place) {
                Show(Say("couldn't look that up, try again in a bit"));
                return;
            }

            if (place.codes?.admin_district !== LIVERPOOL) {
                Show(
                    Say(place.postcode + " is in " + (place.admin_district || "a different council") + ", only liverpool for now"),
                    Line(Link("find yours on gov.uk", "https://www.gov.uk/find-your-local-councillors"))
                );
                return;
            }

            const ward = WARDS[place.codes.admin_ward] || WARDS_BY_NAME[simplify(place.admin_ward)];
            if (!ward) {
                Show(
                    Say("couldn't match " + place.postcode + " to a ward"),
                    Line(Link("try the council's list", COUNCIL_PAGE))
                );
                return;
            }

            const [wardname, councillors] = ward;
            const nodes = [Say(place.postcode + " is in " + wardname + " ward")];

            for (const [name, email] of councillors) {
                const cllr = Line(EmailLink("Press to make a Difference! (" + email + ")", [email], "Councillor " + Surname(name), place.postcode));
                cllr.className = "cllr";
                const bold = document.createElement("b");
                bold.textContent = name;
                cllr.prepend(bold);
                nodes.push(cllr);
            }

            if (councillors.length > 1) {
                const surnames = councillors.map(c => Surname(c[0]));
                const everyone = "Councillors " + surnames.slice(0, -1).join(", ") + " & " + surnames[surnames.length - 1];
                const all = Line(EmailLink("email them all", councillors.map(c => c[1]), everyone, place.postcode));
                all.className = "cllr";
                nodes.push(all);
            }

            Show(...nodes);
            RefreshEmails();
        });

        // "Richard Kemp, CBE" -> "Kemp", "Lord Mike Storey" -> "Storey"
        function Surname(name) {
            return name.replace(/,.*$/, "").trim().split(" ").pop();
        }

        function EmailLink(text, emails, councillor, postcode) {
            const a = Link(text, "#");
            a.dataset.emails = emails.join(",");
            a.dataset.councillor = councillor;
            a.dataset.postcode = postcode;
            return a;
        }

        // (re)builds every email link's mailto: with the letter and whatever's in the name box
        function RefreshEmails() {
            const name = nameInput.value.trim() || "[insert name here]";
            for (const a of result.querySelectorAll("a[data-emails]")) {
                const body = MESSAGE.split("{councillor}").join(a.dataset.councillor)
                    .split("{name}").join(name)
                    .split("{postcode}").join(a.dataset.postcode)
                    .replace(/\r?\n/g, "\r\n");
                a.href = "mailto:" + a.dataset.emails + "?subject=" + encodeURIComponent(SUBJECT) + "&body=" + encodeURIComponent(body);
            }
        }

        function Show(...nodes) {
            result.replaceChildren(...nodes);
        }

        function Say(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div;
        }

        function Line(...nodes) {
            const div = document.createElement("div");
            div.append(...nodes);
            return div;
        }

        function Link(text, href) {
            const a = document.createElement("a");
            a.textContent = text;
            a.href = href;
            return a;
        }
    </script>
